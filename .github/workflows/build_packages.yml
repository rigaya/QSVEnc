name: Build Linux Packages

on:
  push:
    branches:
      - linux
  workflow_call:
    inputs:
      release_sha:
        description: Release対象commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerimg: ubuntu2004
            pkgtype: deb
          - dockerimg: fedora41
            pkgtype: rpm

    env:
      DOCKER_IMAGE: ${{ matrix.dockerimg }}
      PKG_TYPE: ${{ matrix.pkgtype }}
      BASE_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/qsvenc-build
      FFMPEG_PREFIX: /opt/build_scripts/ffmpeg_dll/build_dll/x64/build

    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        id: prep
        run: |
          REPOSITORY=$(echo ${{ github.repository }} | sed -e "s#.*/##")
          VERSION=$(echo ${{ github.ref }} | sed -e "s#refs/tags/##g")
          NPROC=$(grep 'processor' /proc/cpuinfo | wc -l)
          OUTPUT_DIR=`pwd`/output
          LOCAL_USER_ID=$(id -u)
          LOCAL_GROUP_ID=$(id -g)
          BASE_IMAGE="${{ env.BASE_IMAGE_REPO }}:${{ env.DOCKER_IMAGE }}"
          echo "base_image=${BASE_IMAGE}" >> $GITHUB_OUTPUT
          echo "nproc=${NPROC}" >> $GITHUB_OUTPUT
          echo "output_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT
          echo "local_user_id=${LOCAL_USER_ID}" >> $GITHUB_OUTPUT
          echo "local_group_id=${LOCAL_GROUP_ID}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          submodules: true
          fetch-depth: 0

      - name: Verify checkout commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: checkoutしたcommit ($ACTUAL_SHA) が対象commit ($EXPECTED_SHA) と一致しません。" >&2
            exit 1
          fi

      - name: Pull base image
        run: docker pull ${{ steps.prep.outputs.base_image }}

      - name: Create Output Dir
        run: |
          mkdir -p ${{ steps.prep.outputs.output_dir }}

      - name: Build Exec
        id: build_exec
        run: |
          docker run -dit --rm \
            -v ${{ github.workspace }}:/work \
            -v ${{ steps.prep.outputs.output_dir }}:/output \
            -u "$(id -u):$(id -g)" \
            --workdir /work \
            --name build_pkg ${{ steps.prep.outputs.base_image }}
          docker exec -e PKG_CONFIG_PATH=${{ env.FFMPEG_PREFIX }}/lib/pkgconfig build_pkg bash -lc '
            meson setup ./build . --buildtype=release -Db_lto=true -Dlibass_static=true -Dcpp_args="['\''-I/work/AviSynthPlus/avs_core/include'\'','\''-I/work/vapoursynth/include'\'']"
          '
          docker exec build_pkg bash -lc "meson compile -C ./build -j${{ steps.prep.outputs.nproc }}"
          docker exec build_pkg ldd ./build/qsvencc
          docker exec build_pkg ./build/qsvencc --version
          docker exec build_pkg ./check_options.py -exe ./build/qsvencc
          docker exec build_pkg ./build/qsvencc --check-cmd-parse
          docker exec build_pkg cp ./build/qsvencc ./qsvencc
          docker exec build_pkg ./build_${{ env.PKG_TYPE }}.sh
          docker exec build_pkg bash -lc "cp -v ./*.${{ env.PKG_TYPE }} /output/"
          PKGFILE=`ls ${{ steps.prep.outputs.output_dir }}/*.${{ env.PKG_TYPE }}`
          echo ${PKGFILE}
          echo "pkgfile=${PKGFILE}" >> $GITHUB_OUTPUT

      - name: Calc hash
        id: calc_hash
        run: |
          7z h -scrc* ${{ steps.build_exec.outputs.pkgfile }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSVEncC_${{ matrix.dockerimg }}_${{ matrix.pkgtype }}
          path: ${{ steps.build_exec.outputs.pkgfile }}
          retention-days: 14
